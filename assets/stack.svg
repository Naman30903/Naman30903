<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="Stack: Flutter client, Go services, cloud infrastructure">
  <defs>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ADD8" stop-opacity=".15"/>
      <stop offset="50%" stop-color="#00ADD8" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#00ADD8" stop-opacity=".15"/>
    </linearGradient>
    <pattern id="g2" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#16212C" stroke-width="1"/>
    </pattern>
    <clipPath id="p2"><rect x="1" y="1" width="898" height="248" rx="14"/></clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .cap  { font-size: 10.5px; letter-spacing: 1.6px; fill: #4A6076; }
    .item { font-size: 13.5px; fill: #C3D2E0; }
    .card { fill: #0E151C; stroke: #1E2A36; stroke-width: 1.2; }

    .pop { opacity: 0; animation: pop .55s ease-out forwards; }
    .p1 { animation-delay: .15s } .p2 { animation-delay: .45s } .p3 { animation-delay: .75s }
    @keyframes pop { from { opacity:0; transform: translateY(8px) } to { opacity:1; transform: translateY(0) } }

    .pulse { animation: pulse 2.6s ease-in-out infinite; }
    .q1 { animation-delay: 0s } .q2 { animation-delay: .5s } .q3 { animation-delay: 1s }
    @keyframes pulse { 0%,100% { opacity:.35 } 50% { opacity:1 } }

    @media (prefers-reduced-motion: reduce) {
      .pop { animation: none; opacity: 1 }
      .pulse { animation: none; opacity: .8 }
      .pkt { display: none }
    }
  </style>

  <g clip-path="url(#p2)">
    <rect width="900" height="250" rx="14" fill="#0A0E13"/>
    <rect width="900" height="250" fill="url(#g2)" opacity=".5"/>

    <path d="M272 132 H332" stroke="url(#wire)" stroke-width="1.6"/>
    <path d="M568 132 H628" stroke="url(#wire)" stroke-width="1.6"/>
    <path d="M326 127 l7 5 -7 5" fill="none" stroke="#00ADD8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M622 127 l7 5 -7 5" fill="none" stroke="#00ADD8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

    <circle class="pkt" r="3.2" fill="#54C5F8">
      <animateMotion dur="2.2s" repeatCount="indefinite" path="M272 132 H332"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle class="pkt" r="3.2" fill="#7C5CFF">
      <animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite" path="M568 132 H628"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
    </circle>

    <g class="pop p1">
      <text class="mono cap" x="36" y="44">CLIENT</text>
      <rect class="card" x="36" y="56" width="236" height="152" rx="12"/>
      <circle class="pulse q1" cx="58" cy="94"  r="3.5" fill="#54C5F8"/>
      <text class="mono item" x="74" y="99">Flutter</text>
      <circle class="pulse q2" cx="58" cy="132" r="3.5" fill="#54C5F8"/>
      <text class="mono item" x="74" y="137">Dart</text>
      <circle class="pulse q3" cx="58" cy="170" r="3.5" fill="#54C5F8"/>
      <text class="mono item" x="74" y="175">Firebase</text>
    </g>

    <g class="pop p2">
      <text class="mono cap" x="332" y="44">SERVICE</text>
      <rect class="card" x="332" y="56" width="236" height="152" rx="12"/>
      <circle class="pulse q2" cx="354" cy="94"  r="3.5" fill="#00ADD8"/>
      <text class="mono item" x="370" y="99">Go</text>
      <circle class="pulse q3" cx="354" cy="132" r="3.5" fill="#00ADD8"/>
      <text class="mono item" x="370" y="137">REST APIs</text>
      <circle class="pulse q1" cx="354" cy="170" r="3.5" fill="#00ADD8"/>
      <text class="mono item" x="370" y="175">PostgreSQL · MySQL</text>
    </g>

    <g class="pop p3">
      <text class="mono cap" x="628" y="44">INFRA</text>
      <rect class="card" x="628" y="56" width="236" height="152" rx="12"/>
      <circle class="pulse q3" cx="650" cy="94"  r="3.5" fill="#7C5CFF"/>
      <text class="mono item" x="666" y="99">Docker</text>
      <circle class="pulse q1" cx="650" cy="132" r="3.5" fill="#7C5CFF"/>
      <text class="mono item" x="666" y="137">Kubernetes</text>
      <circle class="pulse q2" cx="650" cy="170" r="3.5" fill="#7C5CFF"/>
      <text class="mono item" x="666" y="175">AWS</text>
    </g>

    <rect x="1" y="1" width="898" height="248" rx="14" fill="none" stroke="#1E2A36" stroke-width="1.5"/>
  </g>
</svg>
