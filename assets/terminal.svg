<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="Terminal session: whoami, skills, projects, contact">
  <defs>
    <linearGradient id="t-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#2B3B4A"/>
      <stop offset="50%"  stop-color="#16202B"/>
      <stop offset="100%" stop-color="#2B3B4A"/>
    </linearGradient>
    <pattern id="t-grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#16212C" stroke-width="1"/>
    </pattern>
    <clipPath id="t-panel"><rect x="1" y="1" width="898" height="398" rx="14"/></clipPath>
    <clipPath id="c1"><rect id="c1r" x="70" y="76" width="0" height="20"/></clipPath>
    <clipPath id="c2"><rect id="c2r" x="70" y="152" width="0" height="20"/></clipPath>
    <clipPath id="c3"><rect id="c3r" x="70" y="228" width="0" height="20"/></clipPath>
    <clipPath id="c4"><rect id="c4r" x="70" y="304" width="0" height="20"/></clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }

    #c1r { animation: type1 .55s steps(6)  .3s  forwards; }
    #c2r { animation: type2 .55s steps(6)  1.8s forwards; }
    #c3r { animation: type3 .65s steps(8)  3.2s forwards; }
    #c4r { animation: type4 .6s  steps(7)  4.7s forwards; }
    @keyframes type1 { from { width:0 } to { width:70px } }
    @keyframes type2 { from { width:0 } to { width:64px } }
    @keyframes type3 { from { width:0 } to { width:84px } }
    @keyframes type4 { from { width:0 } to { width:76px } }

    .out      { opacity: 0; animation: fade .4s ease-out forwards; }
    .o1 { animation-delay: 1.1s; }
    .o2 { animation-delay: 2.5s; }
    .o3 { animation-delay: 4.0s; }
    .o4 { animation-delay: 5.45s; }
    @keyframes fade { from { opacity:0; transform: translateY(4px);} to { opacity:1; transform: translateY(0);} }

    .p2, .p3, .p4, .p-final { opacity: 0; animation: fade .3s ease-out forwards; }
    .p2 { animation-delay: 1.8s; }
    .p3 { animation-delay: 3.2s; }
    .p4 { animation-delay: 4.7s; }
    .p-final { animation-delay: 5.95s; }

    .cursor { opacity: 0; animation: appear 0s 5.95s forwards, blink 1.05s steps(1) 5.95s infinite; }
    @keyframes appear { to { opacity: 1 } }
    @keyframes blink { 0%,49% {opacity:1} 50%,100% {opacity:0} }

    @media (prefers-reduced-motion: reduce) {
      #c1r, #c2r, #c3r, #c4r { animation: none; }
      #c1r { width:70px } #c2r { width:64px } #c3r { width:84px } #c4r { width:76px }
      .out, .p2, .p3, .p4, .p-final, .cursor { animation: none; opacity: 1; }
    }
  </style>

  <g clip-path="url(#t-panel)">
    <rect width="900" height="400" rx="14" fill="#0A0E13"/>
    <rect width="900" height="400" fill="url(#t-grid)" opacity=".55"/>
    <circle cx="120" cy="400" r="210" fill="#00ADD8" opacity=".06"/>
    <circle cx="820" cy="16"  r="170" fill="#7C5CFF" opacity=".06"/>
    <rect width="900" height="34" fill="#0D131A"/>
    <line x1="0" y1="34" x2="900" y2="34" stroke="#16212C"/>
    <circle cx="24" cy="17" r="5" fill="#FF5F57"/>
    <circle cx="44" cy="17" r="5" fill="#FEBC2E"/>
    <circle cx="64" cy="17" r="5" fill="#28C840"/>
    <text class="mono" x="450" y="21" font-size="11.5" fill="#4A6076" text-anchor="middle">~/naman — zsh</text>

    <!-- whoami -->
    <text class="mono" x="52" y="91" font-size="15" fill="#00ADD8">$</text>
    <g clip-path="url(#c1)"><text class="mono" x="70" y="91" font-size="15" fill="#8FA6BC">whoami</text></g>
    <text class="mono out o1" x="52" y="117" font-size="13.5" fill="#C3D2E0">Naman Jain — software engineer, India</text>

    <!-- skills -->
    <text class="mono p2" x="52" y="167" font-size="15" fill="#00ADD8">$</text>
    <g clip-path="url(#c2)"><text class="mono" x="70" y="167" font-size="15" fill="#8FA6BC">skills</text></g>
    <text class="mono out o2" x="52" y="193" font-size="13.5" fill="#C3D2E0">flutter · dart · go · postgres · docker · aws</text>

    <!-- projects -->
    <text class="mono p3" x="52" y="243" font-size="15" fill="#00ADD8">$</text>
    <g clip-path="url(#c3)"><text class="mono" x="70" y="243" font-size="15" fill="#8FA6BC">projects</text></g>
    <text class="mono out o3" x="52" y="269" font-size="13.5" fill="#C3D2E0">parsec · resqlink-backend · smart_trip_planner · crop_guard · ezy-expense · hedge-pro</text>

    <!-- contact -->
    <text class="mono p4" x="52" y="319" font-size="15" fill="#00ADD8">$</text>
    <g clip-path="url(#c4)"><text class="mono" x="70" y="319" font-size="15" fill="#8FA6BC">contact</text></g>
    <text class="mono out o4" x="52" y="345" font-size="13.5" fill="#C3D2E0">namanjain9125@gmail.com · linkedin.com/in/namanjain30903</text>

    <!-- resting prompt + cursor -->
    <text class="mono p-final" x="52" y="373" font-size="15" fill="#00ADD8">$</text>
    <rect class="cursor" x="70" y="359" width="8" height="17" fill="#00ADD8"/>

    <rect x="1" y="1" width="898" height="398" rx="14" fill="none" stroke="url(#t-edge)" stroke-width="1.5"/>
  </g>
</svg>
