<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Naman Jain — software engineer">
  <defs>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#54C5F8"/>
      <stop offset="45%"  stop-color="#00ADD8"/>
      <stop offset="100%" stop-color="#7C5CFF"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00ADD8"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#2B3B4A"/>
      <stop offset="50%"  stop-color="#16202B"/>
      <stop offset="100%" stop-color="#2B3B4A"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#16212C" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="typeclip"><rect id="tc" x="52" y="86" width="0" height="26"/></clipPath>
    <clipPath id="panel"><rect x="1" y="1" width="898" height="298" rx="14"/></clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }

    .fx      { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.3,1) forwards; }
    .d-name  { animation-delay: 1.35s; }
    .d-l1    { animation-delay: 1.95s; }
    .d-l2    { animation-delay: 2.15s; }
    .d-l3    { animation-delay: 2.35s; }

    @keyframes rise { from { opacity:0; transform: translateY(9px);} to { opacity:1; transform: translateY(0);} }

    #tc { animation: type 1.0s steps(11) .35s forwards; }
    @keyframes type { from { width:0 } to { width:150px } }

    .cursor { animation: blink 1.05s steps(1) .1s infinite; }
    @keyframes blink { 0%,49% {opacity:1} 50%,100% {opacity:0} }

    .draw { stroke-dasharray: 300; stroke-dashoffset: 300; animation: draw 1.1s ease-out 1.75s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0 } }

    .sheen { animation: sheen 5.5s ease-in-out 2.6s infinite; }
    @keyframes sheen { 0%,88%,100% { opacity:0 } 94% { opacity:.5 } }

    @media (prefers-reduced-motion: reduce) {
      .fx,.cursor,.draw,.sheen,#tc { animation: none; opacity: 1; }
      #tc { width: 150px; }
      .draw { stroke-dashoffset: 0; }
      .sheen { opacity: 0; }
    }
  </style>

  <g clip-path="url(#panel)">
    <rect width="900" height="300" rx="14" fill="#0A0E13"/>
    <rect width="900" height="300" fill="url(#grid)" opacity=".55"/>
    <circle cx="120" cy="300" r="210" fill="#00ADD8" opacity=".07"/>
    <circle cx="820" cy="16"  r="170" fill="#7C5CFF" opacity=".07"/>
    <rect width="900" height="34" fill="#0D131A"/>
    <line x1="0" y1="34" x2="900" y2="34" stroke="#16212C"/>
    <circle cx="24" cy="17" r="5" fill="#FF5F57"/>
    <circle cx="44" cy="17" r="5" fill="#FEBC2E"/>
    <circle cx="64" cy="17" r="5" fill="#28C840"/>
    <text class="mono" x="450" y="21" font-size="11.5" fill="#4A6076" text-anchor="middle">~/naman — zsh</text>

    <text class="mono" x="52" y="105" font-size="15" fill="#00ADD8">$</text>
    <g clip-path="url(#typeclip)">
      <text class="mono" x="70" y="105" font-size="15" fill="#8FA6BC">whoami</text>
    </g>
    <rect class="cursor" x="146" y="90" width="8" height="18" fill="#00ADD8"/>

    <text class="sans fx d-name" x="52" y="182" font-size="60" font-weight="800" fill="url(#name)" letter-spacing="-1.6">Naman Jain</text>
    <text class="sans sheen" x="52" y="182" font-size="60" font-weight="800" fill="#FFFFFF" letter-spacing="-1.6" filter="url(#glow)">Naman Jain</text>

    <path class="draw" d="M54 200 H430" stroke="url(#rule)" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <text class="mono fx d-l1" x="54" y="230" font-size="14.5" fill="#C3D2E0">Software engineer, India</text>
    <text class="mono fx d-l2" x="54" y="254" font-size="13.5" fill="#6B8299">I build the interface and the service behind it.</text>
    <text class="mono fx d-l3" x="54" y="278" font-size="13"   fill="#4A6076">flutter · dart · go · postgres · docker · aws</text>

    <rect x="1" y="1" width="898" height="298" rx="14" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  </g>
</svg>
